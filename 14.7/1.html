<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои фильмы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        form {
            background: #f4f4f4;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        form input, form button {
            margin: 5px;
            padding: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #eee;
        }
        button {
            cursor: pointer;
        }
        .sort-bar {
            margin-bottom: 10px;
        }
        .error {
            color: red;
            margin: 5px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Управление фильмами</h2>

    <form id="movieForm">
        <input type="text" id="title" placeholder="Название фильма" required>
        <input type="text" id="genre" placeholder="Жанр" required>
        <input type="number" id="year" placeholder="Год выпуска" required>
        <button type="submit" id="submitBtn">Добавить фильм</button>
        <button type="button" id="cancelEdit">Отменить редактирование</button>
        <div id="formError" class="error"></div>
    </form>

    <div class="sort-bar">
        <label>Сортировать по: </label>
        <select id="sortSelect">
            <option value="title">Названию</option>
            <option value="genre">Жанру</option>
            <option value="year">Году</option>
        </select>
        <button id="sortBtn">Применить</button>
    </div>

    <table id="movieTable">
        <thead>
            <tr><th>Название</th><th>Жанр</th><th>Год</th><th>Действия</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    let movies = [];
    let editIndex = null;

    const titleInput = document.getElementById('title');
    const genreInput = document.getElementById('genre');
    const yearInput = document.getElementById('year');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelEdit');
    const tableBody = document.getElementById('tableBody');
    const sortSelect = document.getElementById('sortSelect');
    const sortBtn = document.getElementById('sortBtn');
    const formError = document.getElementById('formError');

    function saveToLocalStorage() {
        localStorage.setItem('movies', JSON.stringify(movies));
    }

    function loadFromLocalStorage() {
        const data = localStorage.getItem('movies');
        if (data) {
            movies = JSON.parse(data);
        } else {
            movies = [];
        }
        renderTable();
    }

    function validateForm(title, genre, year) {
        if (!title.trim()) {
            formError.textContent = 'Название фильма обязательно';
            return false;
        }
        if (!genre.trim()) {
            formError.textContent = 'Жанр обязателен';
            return false;
        }
        if (!year || isNaN(year) || year < 1800 || year > new Date().getFullYear()) {
            formError.textContent = 'Введите корректный год (1800-текущий)';
            return false;
        }
        formError.textContent = '';
        return true;
    }

    function addMovie(title, genre, year) {
        movies.push({ title: title.trim(), genre: genre.trim(), year: parseInt(year) });
        saveToLocalStorage();
        renderTable();
    }

    function updateMovie(index, title, genre, year) {
        movies[index] = { title: title.trim(), genre: genre.trim(), year: parseInt(year) };
        saveToLocalStorage();
        renderTable();
        cancelEditMode();
    }

    function deleteMovie(index) {
        movies.splice(index, 1);
        saveToLocalStorage();
        renderTable();
        if (editIndex === index) cancelEditMode();
        else if (editIndex > index) editIndex--;
    }

    function editMovie(index) {
        const movie = movies[index];
        titleInput.value = movie.title;
        genreInput.value = movie.genre;
        yearInput.value = movie.year;
        editIndex = index;
        submitBtn.textContent = 'Сохранить изменения';
        cancelBtn.style.display = 'inline-block';
        formError.textContent = '';
    }

    function cancelEditMode() {
        titleInput.value = '';
        genreInput.value = '';
        yearInput.value = '';
        editIndex = null;
        submitBtn.textContent = 'Добавить фильм';
        cancelBtn.style.display = 'none';
        formError.textContent = '';
    }

    function renderTable() {
        const sortValue = sortSelect.value;
        const sortedMovies = [...movies];
        if (sortValue === 'title') {
            sortedMovies.sort((a, b) => a.title.localeCompare(b.title));
        } else if (sortValue === 'genre') {
            sortedMovies.sort((a, b) => a.genre.localeCompare(b.genre));
        } else if (sortValue === 'year') {
            sortedMovies.sort((a, b) => a.year - b.year);
        }

        tableBody.innerHTML = '';
        sortedMovies.forEach((movie, idx) => {
            const originalIndex = movies.findIndex(m => m.title === movie.title && m.genre === movie.genre && m.year === movie.year);
            const row = tableBody.insertRow();
            row.insertCell(0).textContent = movie.title;
            row.insertCell(1).textContent = movie.genre;
            row.insertCell(2).textContent = movie.year;
            const actionsCell = row.insertCell(3);
            const editBtn = document.createElement('button');
            editBtn.textContent = 'Редактировать';
            editBtn.onclick = () => editMovie(originalIndex);
            const delBtn = document.createElement('button');
            delBtn.textContent = 'Удалить';
            delBtn.onclick = () => deleteMovie(originalIndex);
            actionsCell.appendChild(editBtn);
            actionsCell.appendChild(document.createTextNode(' '));
            actionsCell.appendChild(delBtn);
        });
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        const title = titleInput.value;
        const genre = genreInput.value;
        const year = yearInput.value;

        if (!validateForm(title, genre, year)) return;

        if (editIndex !== null) {
            updateMovie(editIndex, title, genre, year);
        } else {
            addMovie(title, genre, year);
        }
        cancelEditMode();
    }

    function handleSort() {
        renderTable();
    }

    submitBtn.addEventListener('click', handleFormSubmit);
    cancelBtn.addEventListener('click', cancelEditMode);
    sortBtn.addEventListener('click', handleSort);
    cancelBtn.style.display = 'none';

    loadFromLocalStorage();
</script>
</body>
</html>
