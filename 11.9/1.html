<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Форма опроса</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 300px;
            padding: 5px;
        }
        .error {
            color: red;
            font-size: 0.9em;
            margin-top: 3px;
        }
        .result {
            margin-top: 30px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
        button {
            margin-top: 10px;
            padding: 5px 15px;
        }
    </style>
</head>
<body>
    <h2>Опрос пользователя</h2>

    <div class="form-group">
        <label>Имя пользователя *</label>
        <input type="text" id="name">
        <div id="nameError" class="error"></div>
    </div>

    <div class="form-group">
        <label>Email *</label>
        <input type="email" id="email">
        <div id="emailError" class="error"></div>
    </div>

    <div class="form-group">
        <label>Пол</label>
        <input type="radio" name="gender" value="Мужской"> Мужской
        <input type="radio" name="gender" value="Женский"> Женский
    </div>

    <div class="form-group">
        <label>Оценка сервиса (1–10)</label>
        <input type="range" id="rating" min="1" max="10" value="5">
        <span id="ratingValue">5</span>
    </div>

    <div class="form-group">
        <label>Интересы</label><br>
        <input type="checkbox" value="Спорт"> Спорт
        <input type="checkbox" value="Музыка"> Музыка
        <input type="checkbox" value="Путешествия"> Путешествия
        <input type="checkbox" value="Кино"> Кино
    </div>

    <div class="form-group">
        <label>Дополнительные комментарии</label>
        <textarea id="comments" rows="3" cols="40"></textarea>
    </div>

    <button id="submitBtn">Отправить</button>

    <div id="result" class="result"></div>

    <script>
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const ratingSlider = document.getElementById('rating');
        const ratingSpan = document.getElementById('ratingValue');
        const submitBtn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');
        const nameErrorDiv = document.getElementById('nameError');
        const emailErrorDiv = document.getElementById('emailError');

        ratingSlider.addEventListener('input', function() {
            ratingSpan.textContent = this.value;
        });

        function validateEmail(email) {
            const parts = email.split('@');
            if (parts.length !== 2) return false;
            const local = parts[0];
            const domain = parts[1];
            if (local.length === 0) return false;
            if (domain.length < 3) return false;
            if (domain.indexOf('.') === -1) return false;
            return true;
        }

        function getSelectedGender() {
            const radios = document.querySelectorAll('input[name="gender"]');
            for (let i = 0; i < radios.length; i++) {
                if (radios[i].checked) {
                    return radios[i].value;
                }
            }
            return 'не выбран';
        }

        function getSelectedInterests() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            let selected = [];
            for (let i = 0; i < checkboxes.length; i++) {
                if (checkboxes[i].checked) {
                    selected.push(checkboxes[i].value);
                }
            }
            if (selected.length === 0) return 'нет';
            return selected.join(', ');
        }

        submitBtn.addEventListener('click', function() {
            let isValid = true;
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();

            if (name === '') {
                nameErrorDiv.textContent = 'Имя обязательно';
                isValid = false;
            } else {
                nameErrorDiv.textContent = '';
            }

            if (email === '') {
                emailErrorDiv.textContent = 'Email обязателен';
                isValid = false;
            } else if (!validateEmail(email)) {
                emailErrorDiv.textContent = 'Введите корректный email (например, name@mail.ru)';
                isValid = false;
            } else {
                emailErrorDiv.textContent = '';
            }

            if (!isValid) {
                return;
            }

            const gender = getSelectedGender();
            const rating = ratingSlider.value;
            const interests = getSelectedInterests();
            const comments = document.getElementById('comments').value;

            resultDiv.innerHTML = '<h3>Результаты:</h3>' +
                '<p><strong>Имя:</strong> ' + name + '</p>' +
                '<p><strong>Email:</strong> ' + email + '</p>' +
                '<p><strong>Пол:</strong> ' + gender + '</p>' +
                '<p><strong>Оценка:</strong> ' + rating + '/10</p>' +
                '<p><strong>Интересы:</strong> ' + interests + '</p>' +
                '<p><strong>Комментарии:</strong> ' + (comments || '—') + '</p>';
        });
    </script>
</body>
</html>
